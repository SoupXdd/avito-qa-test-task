plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.12.0'
    id 'io.qameta.allure' version '4.3.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.rest-assured:rest-assured:6.3.0'
    testRuntimeOnly 'tools.jackson.core:jackson-databind:3.2.3'
    testImplementation 'com.codeborne:selenide:7.19.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

allure {
    version = '2.42.1'
}

checkstyle {
    toolVersion = '10.24.0'
}

spotless {
    java {
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'selenide.headless', providers.systemProperty('selenide.headless').getOrElse('true')
    outputs.upToDateWhen { false }
}

tasks.register('apiTest', Test) {
    group = 'verification'
    description = 'Runs the API tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'qa.api.*'
    }
}

tasks.register('uiTest', Test) {
    group = 'verification'
    description = 'Runs the browser tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'qa.ui.*'
    }
}
